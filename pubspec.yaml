name: pokemon_card_slot_battle
description: Card battler + slot machine + procedural maze.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: any
  riverpod_annotation: any
  go_router: any

  freezed_annotation: any
  json_annotation: any

  drift: any
  sqlite3_flutter_libs: any
  path_provider: any
  path: any
  shared_preferences: any

  dio: any
  supabase_flutter: any
  connectivity_plus: any

  cached_network_image: any
  flutter_cache_manager: any

  flame: any
  flame_audio: any
  flutter_animate: any
  lottie: any
  rive: any
  confetti: any
  shimmer: any
  flutter_staggered_animations: any
  fl_chart: any

  collection: any
  equatable: any
  uuid: any
  logger: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  freezed: any
  json_serializable: any
  riverpod_generator: any
  drift_dev: any
  mocktail: any
  golden_toolkit: any

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/sprites/
    - assets/data/
    - assets/lottie/
    - assets/rive/
    - assets/fonts/
